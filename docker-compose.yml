services:
  postgres:
    image: postgres:17

    container_name: multi_tenant_postgres

    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multi_tenant

    volumes:
      - multi-tenant-data:/var/lib/postgresql/data

volumes:
  multi-tenant-data:
